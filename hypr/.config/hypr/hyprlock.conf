source = ~/.config/hypr/colors-hyprlock.conf
font = Jetbrains Mono Nerd Font Mono

# GENERAL
general {
    disable_loading_bar = true
        hide_cursor = true
}


# BACKGROUND
background {
    monitor =
        path = ~/Pictures/wallpaper.png
        blur_passes = 1
        blur_size = 1
        noise = 0
        brightness = 0.7
        vibrancy = 1
        contrast = 1
}


# TIME
label {
    monitor =
        text = $TIME
        color = $color14
        font_size = 90
        font_family = $font
        position = 10, 0
        halign = left
        valign = top

        outline_thickness = 3
        outer_color = $color13

        shadow_passes = 1
        shadow_size = 3
        shadow_color = $color9
}

# DATE
label {
    monitor =
        text = cmd[update:43200000] date +"%A, %d %B %Y"
        color = $color12
        font_size = 25
        font_family = $font
        position = 10, -150
        halign = left
        valign = top
        shadow_passes = 1
        shadow_size = 3
        shadow_color = $color9
}

# BATTERY
label {
    monitor =
        text = cmd[update:2] echo -e "$(~/.config/hypr/scripts/chargingData.sh)"
        color = $color15
        font_size = 20
        font_family = $font
        position = 0, 0
        halign = right
        valign = top
        shadow_passes = 1
        shadow_size = 3
        shadow_color = $color9
}

# INPUT FIELD
input-field {
    monitor =
        size = 300, 100
        outline_thickness = 3
        outer_color = rgba(0, 0, 0, 0)

        dots_size = 0.3
        dots_spacing = 0.2
        dots_center = true
        inner_color = rgba(0, 0, 0, 0)
        font_color = $color14
        fade_on_empty = false
        placeholder_text = Hello There $USER
        font_size = 2
        hide_input = false
        check_color = $color11
        fail_color = rgba(255, 0, 0, 100)
        fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
        capslock_color = rgba(255, 255, 0, 100)
        position = 0, 0
        halign = center
        valign = center
        shadow_passes = 1
        shadow_size = 3
        shadow_color = $color9
}


